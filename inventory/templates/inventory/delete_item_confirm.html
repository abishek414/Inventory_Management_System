{% extends "base.html" %}

{% block title %}Delete item{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-3">Delete "{{ item.name }}"?</h1>
        <p class="text-danger">This permanently deletes the item and its stock history. This can't be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
            <a href="{% url 'inventory:item_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
