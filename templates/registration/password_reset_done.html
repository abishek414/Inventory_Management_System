{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-6 text-center">
        <div class="fs-1 text-primary mb-2"><i class="bi bi-envelope-check"></i></div>
        <h1 class="h3 mb-2">Check your email</h1>
        <p class="text-muted mb-4 mx-auto" style="max-width: 26rem;">
            If an account exists with that email address, we've sent a link to reset your
            password. It'll expire in a few days, so use it soon.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary">Back to log in</a>
    </div>
</div>
{% endblock %}
