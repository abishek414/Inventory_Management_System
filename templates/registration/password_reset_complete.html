{% extends "base.html" %}

{% block title %}Password changed{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-6 text-center">
        <div class="fs-1 text-success mb-2"><i class="bi bi-check-circle"></i></div>
        <h1 class="h3 mb-2">Password changed</h1>
        <p class="text-muted mb-4">You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-primary">Log in</a>
    </div>
</div>
{% endblock %}
